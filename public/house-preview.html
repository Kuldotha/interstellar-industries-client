<!doctype html><meta charset="utf-8"><title>House preview</title><style>body{margin:0;background:#17232a;color:#eee;font:15px system-ui}canvas{width:100vw;height:90vh;display:block}p{margin:12px}</style><canvas id="view"></canvas><p id="status">Loading house…</p><script src="vendor/babylon-9.28.0.js"></script><script type="module">
import{createLighting}from'./lighting.js';import{loadHouseModel}from'./house-model.js';import{mergeHousingParts}from'./housing-cluster.js';import{subdivideBuildingGeometry,updateBuildingBounds}from'./building-wrap.js';
const status=document.getElementById('status');try{const B=BABYLON;let engine;if(await B.WebGPUEngine.IsSupportedAsync){engine=new B.WebGPUEngine(document.getElementById('view'));await engine.initAsync();}else{engine=new B.Engine(document.getElementById('view'),true);}const scene=new B.Scene(engine);scene.clearColor=new B.Color4(.09,.14,.17,1);const camera=new B.ArcRotateCamera('camera',-.8,1.12,.85,new B.Vector3(0,10.15,0),scene);camera.minZ=.001;camera.wheelPrecision=150;camera.attachControl(document.getElementById('view'),true);const {sun}=createLighting(B,scene);const make=await loadHouseModel(B,scene),root=new B.TransformNode('house',scene);root.position.y=10;const registry={addShadowCaster(){},removeShadowCaster(){}},underwater={renderList:[]};make(root,0,0,0,1,null,registry,underwater);mergeHousingParts(B,root,scene,registry,underwater);for(const mesh of root.getChildMeshes()){const g=subdivideBuildingGeometry({positions:mesh.getVerticesData('position'),normals:mesh.getVerticesData('normal'),uvs:mesh.getVerticesData('uv'),uvs2:mesh.getVerticesData('uv2'),ao:mesh.getVerticesData('modelAO'),indices:mesh.getIndices()},10,1),data=new B.VertexData();Object.assign(data,g);data.applyToMesh(mesh);if(g.ao)mesh.setVerticesData('modelAO',g.ao,false,1);const a=new Float32Array(g.positions.length);for(let i=1;i<a.length;i+=3)a[i]=10;mesh.setVerticesData('buildingCenter',a,false,3);updateBuildingBounds(B,mesh,root.position);}let frames=0;engine.runRenderLoop(()=>{try{scene.render();if(++frames===60)status.textContent="House · material and close-up shading ready · "+(engine.isWebGPU?"WebGPU":"WebGL");}catch(e){status.textContent="Error: "+e.message;engine.stopRenderLoop();}});window.addEventListener('resize',()=>engine.resize());status.textContent='House · palette and opaque reflective panes · drag to orbit';}catch(e){status.textContent='Error: '+e.message;console.error(e);}
</script>
